<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e16">
<title>Mini Block Moba · Bilanciamento</title>
<link rel="icon" href="img/ui/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e16;--p0:#10141f;--p1:#151b29;--p2:#1d2436;--p3:#262f46;--ln:#2b3550;--tx:#eef1f8;--dim:#8f9ab8;--dim2:#6b7594;--gold:#ffc94a;--up:#5cf07a;--dn:#ff6b62;--cy:#4fd3ff;--mod:#ff9f2e;--org:#7aa2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2',system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(1200px 600px at 50% -200px,#1b2440 0,transparent 70%),var(--bg);min-height:100vh}
.tt{font-family:'Luckiest Guy',cursive;font-weight:400;letter-spacing:.5px}
button{font:inherit;font-weight:800;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:12px;padding:8px 14px;cursor:pointer;line-height:1.1}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.go{background:linear-gradient(180deg,#ffd257,#f59a22);color:#2a1600;border:none;box-shadow:0 3px 0 #b4600c}
button.cy{background:#173447;border-color:#2e6c8c;color:#bfefff}
button.rd{background:#3a1717;border-color:#7a2c2c;color:#ffc9c4}
button.gh{background:transparent;border-color:transparent;color:var(--dim)}
button.sm{padding:4px 9px;font-size:13px;border-radius:9px}
input,select,textarea{font:inherit;font-weight:700;color:var(--tx);background:#0a0d15;border:1px solid var(--ln);border-radius:10px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cy);outline-offset:-1px}
input[type=number]{text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--p1);border:1px solid var(--ln);border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 60px #0008}
.lbox img{width:220px;max-width:80%}
.lbox h1{color:var(--gold);font-size:26px;margin:6px 0 2px}
.lbox p{color:var(--dim);margin:0 0 16px}
.lbox input{width:100%;margin:6px 0;padding:12px;font-size:16px;text-align:left}
.lbox button{width:100%;margin-top:10px;font-size:20px;padding:13px}
#lerr{color:var(--dn);min-height:22px;margin-top:8px;font-weight:700}
/* header */
header{position:sticky;top:0;z-index:20;background:#0b0e16ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.hb{display:flex;gap:10px;align-items:center;padding:8px 12px;max-width:1280px;margin:0 auto}
.hb .logo{height:40px}
.live{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.live b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.live small{color:var(--dim);font-size:12px}
.sp{flex:1}
.hbtn{display:flex;gap:6px;align-items:center}
.ic{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
#chg{position:relative;padding:8px 12px}
#chg .n{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--mod);color:#241200;margin-left:6px}
#chg.zero .n{background:var(--p3);color:var(--dim)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:99px;font-size:14px}
nav button img{width:24px;height:24px;object-fit:contain}
nav button.on{background:var(--gold);color:#1a1205;border-color:#ffe08a}
nav button .d{width:8px;height:8px;border-radius:9px;background:var(--mod);display:none}
nav button.m .d{display:inline-block}
.ng{flex:none;align-self:center;color:var(--dim2);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:0 2px 0 10px;border-left:1px solid var(--ln);margin-left:4px}
main{padding:12px;max-width:1280px;margin:0 auto 120px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools input{flex:1;min-width:160px}
.intro{color:var(--dim);background:var(--p0);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:12px;line-height:1.35}
.intro b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:12px;min-width:0}
.card.m{border-color:#6b4a1d;box-shadow:0 0 0 1px #ff9f2e33 inset}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ch>img{width:64px;height:64px;border-radius:14px;background:#0006;object-fit:contain;flex:none}
.ch .t{font-weight:800;font-size:18px;line-height:1.1}
.ch .s{color:var(--dim);font-size:13px;line-height:1.2}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--p3);color:var(--dim);margin-right:4px;vertical-align:middle}
.tag.ult{background:#4a2a6b;color:#e7c9ff}.tag.ph{background:#4a2a1c;color:#ffc9a6}.tag.mg{background:#1c2f4a;color:#a6d4ff}.tag.w{background:#4a3a14;color:#ffe08a}
.desc{background:#0a0d15;border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:13.5px;line-height:1.35;color:#cfd6ea}
.desc .h{display:block;font-size:11px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.desc.chg{border-color:#6b4a1d}
.desc .old{display:block;color:var(--dim2);text-decoration:line-through;margin-top:4px;font-size:12.5px}
.sec{font-weight:800;color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:12px 2px 4px}
/* field */
.f{border-top:1px solid #222a3d;padding:8px 2px 7px}
.f:first-of-type{border-top:none}
.fr{display:flex;gap:8px;align-items:center}
.fl{flex:1;min-width:0;line-height:1.15}
.fl .lab{font-weight:700}
.fl .q{border:none;background:var(--p3);color:var(--dim);width:20px;height:20px;border-radius:20px;padding:0;font-size:12px;margin-left:4px;vertical-align:1px}
.fi{display:flex;align-items:center;gap:4px;flex:none}
.fi input[type=number]{width:84px}
.fi .pair{display:flex;align-items:center;gap:4px}
.fi .pair input{width:64px}
.fi .u{color:var(--dim);font-size:12.5px;font-weight:700;min-width:14px}
.fi select{max-width:130px}
.fb{display:flex;gap:2px;flex:none}
.fb button{padding:2px 6px;font-size:14px;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--dim)}
.fb button:hover{border-color:var(--ln);color:var(--tx)}
.pv{color:#9fb0d6;font-size:12.5px;margin-top:3px;line-height:1.3}
.pv b{color:#dfe7ff}
.bd{font-size:11.5px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}.bd:empty{display:none}
.bd span{padding:0 6px;border-radius:6px}
.bd .bp{background:#3a2610;color:#ffcf8f}
.bd .bo{background:#18264a;color:#b8cbff}
.f.mod .fl .lab{color:var(--mod)}
.f.mod input{border-color:#a8641c}
.f.org:not(.mod) .fl .lab::after{content:'●';color:var(--org);font-size:10px;margin-left:5px;vertical-align:2px}
.f.rm .fl .lab{text-decoration:line-through;color:var(--dn)}
.hp{display:none;background:#101a2c;border:1px solid #23395e;color:#cfe0ff;border-radius:10px;padding:7px 9px;margin-top:6px;font-size:13px;line-height:1.35}
.f.open .hp{display:block}
.tog{position:relative;width:46px;height:26px;border-radius:26px;background:var(--p3);border:1px solid var(--ln);padding:0}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:20px;background:#aab3cc;transition:.15s}
.tog.on{background:#1f6b3a;border-color:#2e9a55}.tog.on::after{left:22px;background:#fff}
.add{display:flex;gap:6px;margin-top:8px}
.add select{flex:1}
.warn{background:#2a1d0c;border:1px solid #6b4a1d;color:#ffd9a6;border-radius:10px;padding:7px 9px;font-size:12.5px;margin:6px 0;line-height:1.35}
.info{background:#0f1a2e;border:1px solid #23395e;color:#cfe0ff;border-radius:10px;padding:7px 9px;font-size:12.5px;margin:6px 0;line-height:1.35}
/* hero */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 4px;border-radius:14px;background:var(--p1);border:1px solid var(--ln);width:74px;cursor:pointer;position:relative}
.chip img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#0006}
.chip span{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66px}
.chip.on{border-color:var(--gold);background:#2a2412}
.chip .d{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:9px;background:var(--mod);display:none}
.chip.m .d{display:block}
.hero{display:grid;grid-template-columns:260px 1fr;gap:12px;align-items:start}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hcard .full{max-height:230px;width:auto}}
.hcard{background:linear-gradient(180deg,#1f2a45,#121827);border:1px solid var(--ln);border-radius:20px;padding:12px;text-align:center;position:relative;overflow:hidden}
.hcard .full{width:100%;max-width:240px;aspect-ratio:520/650;object-fit:contain;filter:drop-shadow(0 10px 20px #0009)}
.hcard h2{margin:4px 0 0;font-size:28px;color:var(--gold)}
.hcard .ti{color:var(--dim);margin-bottom:6px}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;text-align:left;font-size:13.5px;margin-top:8px}
.kv div{padding:2px 0;border-bottom:1px solid #222a3d}
.kv .h{color:var(--dim);font-size:11.5px;font-weight:800;text-transform:uppercase}
.kv .v{text-align:right;font-weight:800}
.kv .c{color:var(--mod)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skin{background:var(--p0);border:1px solid var(--ln);border-radius:14px;padding:8px;text-align:center}
.skin img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#0006}
.skin b{display:block;font-size:13.5px;line-height:1.15;margin:4px 0}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--dim);font-size:11.5px;text-transform:uppercase;text-align:right;padding:4px 6px;font-weight:800}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:5px 6px;border-top:1px solid #222a3d;text-align:right;font-weight:700;white-space:nowrap}
.tbl td img{width:30px;height:30px;border-radius:8px;vertical-align:middle;margin-right:6px;object-fit:cover}
.tbl .c{color:var(--mod)}
.scroll{overflow-x:auto}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat .card{flex:1;min-width:150px;display:flex;gap:10px;align-items:center}
.stat img{width:44px;height:44px;object-fit:contain}
.stat b{font-size:22px;display:block;line-height:1}
.stat small{color:var(--dim)}
/* drawer */
#drawer{position:fixed;inset:0;z-index:40;background:#000a;display:none}
#drawer.on{display:block}
#dbox{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--p0);border-left:1px solid var(--ln);display:flex;flex-direction:column}
#dbox .dh{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln)}
#dbox .dc{flex:1;overflow:auto;padding:10px 12px}
#dbox .df{padding:10px 12px;border-top:1px solid var(--ln);display:flex;gap:8px;flex-wrap:wrap}
.ci{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:12px;background:var(--p1);margin-bottom:6px}
.ci img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:#0006;flex:none}
.ci .x{flex:1;min-width:0;line-height:1.2}
.ci .x b{font-size:14px}
.ci .x div{font-size:13px;color:#cfd6ea}
.ci .x small{color:var(--dim)}
.ar{font-weight:800}.ar.up{color:var(--up)}.ar.down{color:var(--dn)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#mbox{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:16px}
#mbox h2{margin:0 0 8px;font-size:24px;color:var(--gold)}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* note di gioco */
.gpop{background:linear-gradient(180deg,#232c46,#161c2c);border:3px solid #3a4770;border-radius:22px;padding:14px;box-shadow:0 0 0 2px #0008}
.gpop .gt{text-align:center;font-size:26px;color:var(--gold);text-shadow:0 3px 0 #0008}
.gpop .gs{text-align:center;color:#cfd6ea;margin-bottom:10px}
.gn{display:flex;gap:12px;align-items:center;padding:6px 10px;border:2px solid #b3bfe659;border-radius:12px;background:#ffffff0d;margin-bottom:6px}
.gn.up{border-color:#66ff8059}.gn.down{border-color:#ff736659}
.gn img{width:46px;height:46px;object-fit:contain;flex:none}
.gn .x{flex:1;min-width:0}
.gn .x b{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:17px;display:block;line-height:1.15}
.gn .x span{font-family:'Luckiest Guy',cursive;font-size:14px;color:#b3bfe6;white-space:pre-line;line-height:1.25;display:block}
.gn.up .x span,.gn.up .a{color:#66ff80}.gn.down .x span,.gn.down .a{color:#ff7366}
.gn .a{font-family:'Luckiest Guy',cursive;font-size:22px;color:#b3bfe6}
.gby{text-align:right;color:var(--gold);font-size:20px;margin-top:6px}
.nx{display:flex;gap:6px;align-items:center}
.nx input[type=checkbox]{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:#1d2436;border:1px solid var(--ln);border-radius:14px;padding:10px 16px;font-weight:800;box-shadow:0 10px 30px #0009;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
.ok{color:var(--up)}.err{color:var(--dn)}
.rrow{display:grid;grid-template-columns:44px 118px 1fr auto;grid-template-areas:'i c t x' 'i v v v' 'b b b b';gap:6px 8px;align-items:center;padding:8px;border:1px solid var(--ln);border-radius:14px;background:var(--p0);margin-bottom:6px}
.rrow.mod{border-color:#a8641c}
.rrow img{grid-area:i;width:44px;height:44px;object-fit:contain;border-radius:10px}
.rrow .rc{grid-area:c;display:flex;align-items:center;gap:4px}.rrow .rc input{width:76px}
.rrow .ty{grid-area:t}.rrow .rm{grid-area:x}
.rrow .rv{grid-area:v;display:flex}.rrow .rv input,.rrow .rv select{flex:1;min-width:0;text-align:left}
.rrow .rb{grid-area:b;font-size:11.5px;display:flex;gap:6px;flex-wrap:wrap}.rrow .rb:empty{display:none}
.rrow .rb span{padding:0 6px;border-radius:6px}.rrow .bp{background:#3a2610;color:#ffcf8f}.rrow .bo{background:#18264a;color:#b8cbff}
@media(min-width:700px){.rrow{grid-template-columns:44px 118px 130px 1fr auto;grid-template-areas:'i c t v x' 'b b b b b'}}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rs{background:var(--p0);border:1px solid var(--ln);border-radius:14px;padding:8px;text-align:center}
.rs img{width:54px;height:54px;object-fit:contain;border-radius:10px}
.rs .tr{font-weight:800;color:var(--gold)}
.rs .f{border:none;padding:4px 0 0}
.hist .card{margin-bottom:10px}
.pl .av{width:46px;height:46px;border-radius:14px;background:var(--p3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.pst{display:flex;flex-wrap:wrap;gap:6px 12px;font-weight:700;font-size:13.5px}.pst span{display:flex;align-items:center;gap:4px}.pst img{width:20px;height:20px;object-fit:contain}.pst .dim,.dim{color:var(--dim)}
.dot{display:inline-block;width:10px;height:10px;border-radius:10px;background:var(--up);vertical-align:2px}
.empty{color:var(--dim);text-align:center;padding:30px}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:15;background:#0b0e16f2;border-top:1px solid var(--ln);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center}
.foot input{flex:1;max-width:420px}
.foot button{white-space:nowrap}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <img src="img/ui/logo.webp" alt="">
    <h1 class="tt">Bilanciamento</h1>
    <p>Patch dal vivo per tutti i giocatori</p>
    <input id="who" placeholder="Firma (es. Cheip, Andry)" autocomplete="nickname">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="go tt" id="lbtn">ENTRA</button>
    <div id="lerr"></div>
  </div>
</div>

<div id="app" class="hide">
<header>
  <div class="hb">
    <img class="logo" src="img/ui/logo.webp" alt="">
    <div class="live"><b id="pid">-</b><small id="pinfo"></small></div>
    <div class="sp"></div>
    <div class="hbtn">
      <button class="ic" id="undo" title="Annulla (Ctrl+Z)">↶</button>
      <button class="ic" id="redo" title="Rifai (Ctrl+Y)">↷</button>
      <button id="chg" class="zero" title="Modifiche in bozza">Modifiche<span class="n">0</span></button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="view"></main>
<div class="foot" id="foot">
  <input id="pname" placeholder="Nome della patch (es. Andry più forte)">
  <button class="cy" id="prev">Note</button>
  <button class="go" id="pub">PUBBLICA</button>
</div>
</div>

<div id="drawer"><div id="dbox">
  <div class="dh"><b class="tt" style="font-size:22px;color:var(--gold)">Modifiche</b><div class="sp"></div><button class="gh" id="dclose">✕</button></div>
  <div class="dc" id="dlist"></div>
  <div class="df"><button class="rd sm" id="discard">Scarta la bozza</button><button class="sm" id="factory">Tutto come il gioco originale</button><div class="sp"></div><button class="cy sm" id="dprev">Anteprima note</button></div>
</div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="desc.js"></script>

  if(NEST.has(P.s)){if(del){if(s[P.id]){delete s[P.id][P.k];if(!Object.keys(s[P.id]).length)delete s[P.id]}}else{s[P.id]=s[P.id]||{};s[P.id][P.k]=v}}

function def(P){const{s,id,k}=P;
  if(s==='heroes'){if(k==='name')return H[id]&&H[id].name;if(/^asc_(atk|hp|def)$/.test(k))return valIn(cur,{s:'eco',id:k});const mn=/^skin(\d+)_name$/.exec(k);if(mn){const sk=H[id].skins[+mn[1]];return sk?sk.name:undefined}const m=/^skin(\d+)\.(gems|price)$/.exec(k);if(m){const sk=H[id].skins[+m[1]];return sk?sk[m[2]]:undefined}return H[id]&&H[id].stats[k]}
  if(s==='skills'){const b=S[id];if(!b)return undefined;if(k.startsWith('p.'))return b.p?b.p[k.slice(2)]:undefined;return b[k]}
  if(s==='runes'){const b=R[id];if(!b)return undefined;if(k.startsWith('st.'))return b.st?b.st[k.slice(3)]:undefined;return b[k]}
  if(s==='items'){const b=IT[id];return b?b[k]:undefined}
  if(s==='passives'){const b=PASS[id];if(!b)return undefined;return b.st?b.st[k.slice(3)]:undefined}
  if(s==='units'||s==='eco')return DF[s][id];
  if(s==='spells'){if(id.endsWith('.cd'))return SP[id.split('.')[0]].cd;return DF.spells[id]}
  if(s==='rewards'){if(id==='road')return RW.road;if(id==='hero.price')return RW.hero_price;if(id==='road.skin_gems')return RW.road_skin_gems;if(id in DF.rewards)return DF.rewards[id];
    const a=id.split('.');
    if(a[0]==='camp')return CAMP[a[1]]?(a[2]==='stars'?(CAMP[a[1]].stars||0):CAMP[a[1]][a[2]]):undefined;
    if(a[0]==='chest')return CHEST[a[1]]?(a[2]==='stars'?(CHEST[a[1]].stars||0):CHEST[a[1]][a[2]]):undefined;

let U=[],RD=[],lastKey='',lastT=0;
function snap(key){const t=Date.now();if(key&&key===lastKey&&t-lastT<1500){lastT=t;return}U.push(clone(cur));if(U.length>200)U.shift();RD=[];lastKey=key||'';lastT=t;ubtn()}
function undo(){if(!U.length)return;RD.push(clone(cur));cur=U.pop();lastKey='';ubtn();changed(true);toast('Annullato')}
function redo(){if(!RD.length)return;U.push(clone(cur));cur=RD.pop();lastKey='';ubtn();changed(true);toast('Rifatto')}
function ubtn(){$('#undo').disabled=!U.length;$('#redo').disabled=!RD.length}
function set(P,v,key){snap(key||pkey(P));const d=def(P);if(same(v,d)||(v===null&&d===undefined)||v===undefined)rawSet(cur,P,0,true);else rawSet(cur,P,v);changed(false)}
function setRaw(P,r){snap('');if(r.h)rawSet(cur,P,clone(r.v));else rawSet(cur,P,0,true);changed(true)}

const recvC=v=>Math.round(v*ECO/10)*10, recvG=v=>Math.floor(v*ECO+1e-9);
function rawFromC(T){T=Math.max(0,Math.round(T/10)*10);let v=Math.round(T/ECO);while(recvC(v)<T)v++;while(v>0&&recvC(v-1)>=T)v--;return v}
function rawFromG(T){T=Math.max(0,Math.round(T));let v=Math.ceil(T/ECO-1e-9);while(v>0&&recvG(v-1)>=T)v--;return v}
function show(F,v){if(v===null)return 'tolto';if(v===undefined)return 'nessuno';
  switch(F.kind){case 'pct':return nf(v*100,1)+'%';case 'aps':return nf(1/v,2)+' attacchi/s';
    case 'pair':return Array.isArray(v)?nf(v[0],1)+' + '+nf(v[1]*100,0)+'% potenza':nf(v);
    case 'arr':return Array.isArray(v)?F.parts.map((p,i)=>p.l+' '+(p.k==='pct'?nf(v[i]*100,0)+'%':nf(v[i])+(p.u||''))).join(', '):String(v);
    case 'text':return '"'+String(v)+'"';case 'bool':return v?'sì':'no';case 'road':return Array.isArray(v)?v.length+' tappe':'';case 'rc':return nfi(recvC(v))+' monete';case 'rg':return nfi(recvG(v))+' diamanti';
    case 'mc':return F.goals.map(g=>nfi(Math.max(10,Math.round(v*g*ECO/10)*10))).join(' / ')+' monete';
    case 'mg':return F.goals.map(g=>nfi(Math.floor(v*g*ECO+1e-9))).join(' / ')+' diamanti';
    default:return nf(v,2)+(F.u?' '+F.u:'')}}

  if(b===null||b===undefined)return F.inv?'up':'down';if(a===null||a===undefined)return F.inv?'down':'up';

  return [...m.values()].map(n=>({icon:n.icon,title:n.title,text:n.lines.join('\n'),dir:n.dir,id:n.keys.join(',')}))}

  for(const x of b){const o=am.get(x[0]);if(!o)L.push(nfi(x[0])+' coppe: '+stepDesc(x)+' (nuova tappa)');else if(!same(o,x))L.push(nfi(x[0])+' coppe: '+stepDesc(o)+' → '+stepDesc(x))}

  const sync=()=>{const one=$f('.to').value==='one';f.querySelector('.one').classList.toggle('hide',!one);f.querySelector('.all').classList.toggle('hide',one);$f('.psel').innerHTML=who?'Scelto: <b>'+esc(who.name)+'</b>':'Nessun giocatore scelto';$f('.nt').classList.toggle('on',newToo);prev()};
  const prev=()=>{const gp=$f('.gp');gp.innerHTML='';const d=el('<div class="gpop" style="text-align:center"><img src="img/ui/gift.svg" style="width:70px"><div class="gt tt"></div><div class="gs"></div><div class="rw" style="display:flex;justify-content:center;gap:22px;margin:8px 0"></div><div class="gby tt" style="text-align:center;font-size:16px"></div></div>');
    d.querySelector('.gt').textContent=$f('.ti').value||'UN REGALO PER TE!';d.querySelector('.gs').textContent=$f('.bo').value;const rw=d.querySelector('.rw');
    for(const[img,n]of [['ui:coin',+$f('.co').value],['ui:gem',+$f('.ge').value],['ui:asc',+$f('.sa').value]])if(n>0)rw.appendChild(el('<div style="display:flex;align-items:center;gap:6px;font-family:Luckiest Guy;font-size:26px"><img src="'+IMG(img)+'" style="width:42px">+'+nfi(n)+'</div>'));
    d.querySelector('.gby').textContent='da '+WHO;gp.appendChild(d)};
  if(who)$f('.to').value='one';
  $f('.to').onchange=sync;$f('.nt').onclick=()=>{newToo=!newToo;sync()};for(const k of ['.ti','.bo','.co','.ge','.sa'])$f(k).oninput=prev;
  $f('.ps').onclick=async()=>{const r=await adminU('players',{q:$f('.pq').value.trim(),limit:12});const box=$f('.pres');box.innerHTML='';for(const p of (r.players||[])){const b=el('<button class="sm"></button>');b.textContent=p.name+' ('+p.code+')';b.onclick=()=>{who={id:p.id,name:p.name};sync()};box.appendChild(b)}if(!(r.players||[]).length)box.textContent='Nessuno trovato'};
  $f('.send').onclick=()=>{const one=$f('.to').value==='one';if(one&&!who){toast('Scegli il giocatore');return}
    const args={player_id:one?who.id:'',title:$f('.ti').value.trim(),body:$f('.bo').value.trim(),coins:Math.max(0,parseInt($f('.co').value)||0),gems:Math.max(0,parseInt($f('.ge').value)||0),stars:Math.max(0,parseInt($f('.sa').value)||0),days:Math.max(0,parseInt($f('.da').value)||0),new_too:!one&&newToo,author:WHO};
    if(!args.title&&!args.body&&!args.coins&&!args.gems&&!args.stars){toast('Scrivi un testo o metti un premio');return}
    confirmBox((one?'Mandare il regalo a '+who.name:'Mandare il regalo a TUTTI i giocatori'+(newToo?' (anche ai nuovi)':''))+'? '+[args.coins?nfi(args.coins)+' monete':'',args.gems?nfi(args.gems)+' diamanti':'',args.stars?nfi(args.stars)+' stelle':''].filter(Boolean).join(', '),async()=>{const m=$f('.msg');m.textContent='...';let r;try{r=await adminU('gift',args)}catch(e){r={}}
      if(r.ok){m.className='ok';m.textContent='Mandato';toast('Regalo mandato');setTimeout(()=>render(),600)}else{m.className='err';m.textContent='Errore'}},'Manda')};
  sync();
  const h=card(IMG('ui:gift'),'Regali mandati','Ultimi 50, con quanti li hanno già ritirati.','');h.style.marginTop='12px';v.appendChild(h);const hl=el('<div>Carico…</div>');h.appendChild(hl);
  adminU('gifts',{}).then(r=>{hl.innerHTML='';if(!r.ok){hl.textContent='Errore';return}if(!r.gifts.length){hl.textContent='Nessun regalo mandato.';return}
    for(const g of r.gifts){const it=el('<div class="ci"><img alt=""><div class="x"><b></b><div></div><small></small></div><button class="sm rd">Elimina</button></div>');it.querySelector('img').src=IMG('ui:gift');
      it.querySelector('b').textContent=(g.title||'(senza titolo)')+' → '+(g.player_id?g.player:'tutti'+(g.new_too?' (anche nuovi)':''));
      it.querySelector('.x div').textContent=[g.coins?nfi(g.coins)+' monete':'',g.gems?nfi(g.gems)+' diamanti':'',g.stars?nfi(g.stars)+' stelle':''].filter(Boolean).join(' · ')||'solo messaggio';
      it.querySelector('small').textContent=new Date(g.at*1000).toLocaleString('it-IT')+' · da '+(g.author||'?')+' · ritirato da '+g.claimed+(g.exp?' · scade '+new Date(g.exp*1000).toLocaleDateString('it-IT'):'');
      it.querySelector('button').onclick=()=>confirmBox('Eliminare il regalo? Chi non l\'ha ancora ritirato non lo vedrà più.',async()=>{await adminU('gift_del',{id:g.id});render()},'Elimina');hl.appendChild(it)}})}
function vVersion(v){const ver=state.version||{};const c=card(IMG('ui:logo'),'Versione dell\'app','Si salva subito, non con PUBBLICA.');
  const f=el(`<div><div class="f"><div class="fr"><div class="fl">Versione minima<div class="pv">Chi ha un version code più basso deve aggiornare per giocare online</div></div><div class="fi"><input type="number" class="mi"></div></div></div>
  <div class="f"><div class="fr"><div class="fl">Ultima versione pubblicata<div class="pv">Chi ha meno vede il popup "aggiornamento disponibile"</div></div><div class="fi"><input type="number" class="la"></div></div></div>
  <div class="f"><div class="fr"><div class="fl">Link Play Store</div></div><input class="an" style="width:100%;margin-top:6px"></div>

  f.querySelector('.mi').value=ver.min_code||0;f.querySelector('.la').value=ver.latest_code||0;f.querySelector('.an').value=ver.android||'';f.querySelector('.io').value=ver.ios||'';
  f.querySelector('.sv').onclick=()=>confirmBox('Salvare versione minima '+f.querySelector('.mi').value+' e ultima '+f.querySelector('.la').value+'? Chi ha una versione più vecchia del minimo vedrà il blocco "aggiorna".',async()=>{let r;try{r=await admin('version',{min_code:parseInt(f.querySelector('.mi').value)||0,latest_code:parseInt(f.querySelector('.la').value)||0,android:f.querySelector('.an').value,ios:f.querySelector('.io').value})}catch(e){r={}}const m=f.querySelector('.msg');m.className=r.ok?'ok':'err';m.textContent=r.ok?'Salvato':'Errore';if(r.ok)state=await admin('state')});

function vHist(v){v.appendChild(el('<div class="intro">Le ultime 20 patch pubblicate, con le note che hanno visto i giocatori. Per cambiare qualcosa fai una patch nuova: quella nuova sostituisce la precedente.</div>'));
  const w=el('<div class="hist"></div>');v.appendChild(w);const ps=state.patches||[];
  for(const p of ps){const live=state.patch&&state.patch.id===p.id;const c=card(IMG('ui:logo'),'#'+p.id+' '+esc(p.name||'Patch')+(live?' <span class="tag" style="background:#1f6b3a;color:#cfffdc">ONLINE</span>':''),new Date(p.at*1000).toLocaleString('it-IT')+' · '+esc(p.author||'?')+' · '+(p.notes||[]).length+' note');
    const b=el('<button class="sm cy">Mostra note</button>');const box=el('<div class="hide" style="margin-top:8px"></div>');b.onclick=()=>{box.classList.toggle('hide');b.textContent=box.classList.contains('hide')?'Mostra note':'Nascondi note'};
    for(const n of p.notes||[])box.appendChild(noteEl(n));c.append(b,box);w.appendChild(c)}
  if(!ps.length)w.appendChild(el('<div class="empty">Nessuna patch pubblicata.</div>'))}

// ============================================================ note, modali, cassetto modifiche
function noteEl(n){const e=el('<div class="gn"><img alt=""><div class="x"><b></b><span></span></div><div class="a"></div></div>');if(n.dir==='up'||n.dir==='down')e.classList.add(n.dir);e.querySelector('img').src=noteImg(n.icon);e.querySelector('b').textContent=n.title;e.querySelector('span').textContent=n.text;e.querySelector('.a').textContent=n.dir==='up'?'▲':n.dir==='down'?'▼':'•';return e}
function gamePopup(ns,name){const d=el('<div class="gpop"><div class="gt tt">NUOVA PATCH</div><div class="gs"></div><div class="ls"></div><div class="gby tt"></div></div>');d.querySelector('.gs').textContent=name;for(const n of ns)d.querySelector('.ls').appendChild(noteEl(n));if(!ns.length)d.querySelector('.ls').appendChild(el('<div class="empty">Nessuna nota</div>'));d.querySelector('.gby').textContent='by '+WHO;return d}
function modal(node){$('#mbox').innerHTML='';$('#mbox').appendChild(node);$('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
function confirmBox(text,yes,lab){const d=el('<div><h2 class="tt">Conferma</h2><p></p><div class="mrow"><button class="no">Annulla</button><button class="go yes"></button></div></div>');d.querySelector('p').textContent=text;d.querySelector('.yes').textContent=lab||'Conferma';d.querySelector('.no').onclick=closeM;d.querySelector('.yes').onclick=()=>{closeM();yes()};modal(d)}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
let _tt=null;function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>x.classList.remove('on'),1800)}
function pname(){return $('#pname').value.trim()||('Patch '+((state.patch?state.patch.id:0)+1))}
function notesEditor(){const d=el('<div><h2 class="tt">Note della patch</h2><p style="color:var(--dim);margin:0 0 8px">Scritte da sole dalle modifiche. Puoi nasconderne qualcuna e aggiungere note libere in cima. Sotto vedi il popup come lo vedono i giocatori.</p><div class="ed"></div><div class="mrow" style="justify-content:flex-start"><button class="sm cy addn">+ Nota libera</button></div><div class="pp" style="margin-top:12px"></div><div class="mrow"><button class="cl">Chiudi</button></div></div>');
  const ed=d.querySelector('.ed'),pp=d.querySelector('.pp');
  const redraw=()=>{ed.innerHTML='';FREE.forEach((n,i)=>{const r=el('<div class="card" style="padding:8px;margin-bottom:6px"><input class="t" placeholder="Titolo" style="width:100%;margin-bottom:4px"><textarea class="x" rows="2" placeholder="Testo" style="width:100%"></textarea><div class="mrow" style="margin-top:4px"><button class="sm rd">Togli</button></div></div>');r.querySelector('.t').value=n.title||'';r.querySelector('.x').value=n.text||'';r.querySelector('.t').oninput=e=>{n.title=e.target.value;prev();saveDraft()};r.querySelector('.x').oninput=e=>{n.text=e.target.value;prev();saveDraft()};r.querySelector('.rd').onclick=()=>{FREE.splice(i,1);redraw();saveDraft()};ed.appendChild(r)});
    for(const n of autoNotes()){const r=el('<label class="nx" style="margin:4px 0"><input type="checkbox"><span></span></label>');const cb=r.querySelector('input');cb.checked=!HIDE.has(n.id);r.querySelector('span').textContent=n.title+' ('+n.text.split('\n').length+(n.text.split('\n').length===1?' riga)':' righe)');cb.onchange=()=>{if(cb.checked)HIDE.delete(n.id);else HIDE.add(n.id);prev()};ed.appendChild(r)}prev()};
  const prev=()=>{pp.innerHTML='';pp.appendChild(gamePopup(finalNotes(),pname()))};
  d.querySelector('.addn').onclick=()=>{FREE.push({title:'',text:''});redraw()};d.querySelector('.cl').onclick=closeM;redraw();modal(d)}
$('#prev').onclick=notesEditor;$('#dprev').onclick=()=>{closeDrawer();notesEditor()};
function openDrawer(){const l=$('#dlist');l.innerHTML='';const ds=diffs();
  if(!ds.length)l.appendChild(el('<div class="empty">Nessuna modifica rispetto alla patch online.</div>'));
  for(const d of ds){const dir=dirOf(d);const it=el('<div class="ci"><img alt=""><div class="x"><b></b><div></div><small></small></div><button class="sm" title="Torna al valore online">↺</button><button class="sm cy">Vai</button></div>');
    it.querySelector('img').src=noteImg(d.F.icon);it.querySelector('b').textContent=d.F.title;it.querySelector('.x div').innerHTML=d.F.kind==='road'?esc(roadNote(d.a,d.b)).replace(/\n/g,'<br>'):esc(d.F.l)+': '+esc(show(d.F,d.a))+' → <span class="ar '+dir+'">'+esc(show(d.F,d.b))+'</span>';
    const o=def(d.F.P);it.querySelector('small').textContent=d.F.kind==='road'?(same(d.b,o)?'Torna come il gioco originale':'Serve l\'app 143 o più'):same(d.b,o)?'Torna come il gioco originale':'Originale: '+show(d.F,o);
    const bs=it.querySelectorAll('button');bs[0].onclick=()=>{if(d.F.virt)roadCopy(pub);else setRaw(d.F.P,raw(pub,d.F.P));openDrawer()};bs[1].onclick=()=>{closeDrawer();tab=d.F.tab;q='';if(d.F.tab==='heroes')selHero=d.F.ent;if(d.F.tab==='skills'){skHero='';q=S[d.F.ent]?S[d.F.ent].name:''}if(d.F.tab==='runes')q=R[d.F.ent]?R[d.F.ent].name:'';render();window.scrollTo(0,0)};l.appendChild(it)}
  const n=allFields().filter(F=>{const r=raw(cur,F.P);return r.h}).length;l.appendChild(el('<div class="info" style="margin-top:10px">La patch completa cambia '+n+' valori rispetto al gioco originale (compresi quelli già online).</div>'));
  $('#drawer').classList.add('on')}
function closeDrawer(){$('#drawer').classList.remove('on')}
$('#chg').onclick=openDrawer;$('#dclose').onclick=closeDrawer;$('#drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};
$('#discard').onclick=()=>confirmBox('Scartare tutte le modifiche e tornare alla patch online?',()=>{snap('');cur=norm(pub);FREE=[];HIDE=new Set();changed(true);openDrawer()},'Scarta');
$('#factory').onclick=()=>confirmBox('Mettere tutto come il gioco originale? Dopo PUBBLICA i giocatori tornano ai valori dell\'app (si può annullare con ↶ prima di pubblicare).',()=>{snap('');cur=norm({});changed(true);openDrawer()},'Tutto originale');
$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey)||$('#app').classList.contains('hide'))return;const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}});
$('#pname').oninput=saveDraft;

// unione: le mie modifiche (rispetto alla patch da cui sono partito) sopra una patch nuova pubblicata da altri
function mergeOnto(newPub,from,mine){const out=norm(newPub);for(const s of SECS){const ids=new Set([...Object.keys(from[s]||{}),...Object.keys(mine[s]||{})]);for(const id of ids){if(NEST.has(s)){const ks=new Set([...Object.keys((from[s]||{})[id]||{}),...Object.keys((mine[s]||{})[id]||{})]);for(const k of ks){const P={s,id,k},a=raw(from,P),b=raw(mine,P);if(same(a,b))continue;if(b.h)rawSet(out,P,clone(b.v));else rawSet(out,P,0,true)}}else{const P={s,id},a=raw(from,P),b=raw(mine,P);if(same(a,b))continue;if(b.h)rawSet(out,P,clone(b.v));else rawSet(out,P,0,true)}}}return out}
function loadState(st){state=st;pub=norm(st.patch&&st.patch.data||{});loadedPid=st.patch?st.patch.id:0;base=norm(pub);
  $('#pid').textContent=st.patch?('#'+st.patch.id+' '+(st.patch.name||'')):'Nessuna patch';$('#pinfo').textContent=(st.players||0)+' iscritti · '+(st.online||0)+' online'}
$('#pub').onclick=async()=>{const ns=finalNotes();if(!diffs().length&&!FREE.some(n=>n.title||n.text)){notesEditor();toast('Nessuna modifica da pubblicare');return}
  let st;try{st=await admin('state')}catch(e){toast('Nessuna connessione');return}if(!st.ok){toast('Password non valida');return}
  const nowPid=st.patch?st.patch.id:0;
  const go=()=>{const d=el('<div><h2 class="tt">Pubblica</h2><p></p><div class="pp"></div><div class="mrow"><button class="no">Annulla</button><button class="go yes">PUBBLICA ORA</button></div></div>');d.querySelector('p').textContent='"'+pname()+'" con '+diffs().length+' modifiche. I giocatori la ricevono entro pochi secondi nel menu (mai durante una partita).';
    d.querySelector('.pp').appendChild(gamePopup(finalNotes(),pname()));d.querySelector('.no').onclick=closeM;
    d.querySelector('.yes').onclick=async()=>{const b=d.querySelector('.yes');b.disabled=true;b.textContent='...';let r;try{r=await admin('publish',{name:pname(),author:WHO,data:cur,notes:finalNotes()})}catch(e){r={}}
      if(r.ok){clearDraft();const s2=await admin('state');loadState(s2);cur=norm(pub);U=[];RD=[];ubtn();FREE=[];HIDE=new Set();$('#pname').value='';render();count();const ok=el('<div><h2 class="tt" style="color:var(--up)">Patch online!</h2><p></p><div class="mrow"><button class="go">OK</button></div></div>');ok.querySelector('p').textContent=(s2.patch?'#'+s2.patch.id+' ':'')+pname()+' è arrivata a tutti.';ok.querySelector('button').onclick=closeM;modal(ok)}
      else{b.disabled=false;b.textContent='PUBBLICA ORA';toast('Errore: non pubblicata')}};modal(d)};
  if(nowPid!==loadedPid){const who=st.patch?(st.patch.author||'qualcuno'):'qualcuno';const d=el('<div><h2 class="tt">Patch nuova online</h2><p></p><div class="mrow"><button class="no">Annulla</button><button class="cy rp">Sostituisci la sua</button><button class="go mg">Unisci (consigliato)</button></div></div>');
    d.querySelector('p').textContent=who+' ha pubblicato la patch #'+nowPid+' mentre lavoravi. "Unisci" tiene le sue modifiche e ci mette sopra le tue. "Sostituisci" cancella le sue.';
    d.querySelector('.no').onclick=closeM;d.querySelector('.mg').onclick=()=>{snap('');cur=mergeOnto(norm(st.patch&&st.patch.data||{}),base,cur);loadState(st);changed(true);closeM();go()};d.querySelector('.rp').onclick=()=>{loadState(Object.assign(st));closeM();go()};modal(d);return}
  loadState(st);go()};

// ============================================================ login
try{$('#who').value=localStorage.getItem('mbm_who')||''}catch(e){}
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lbtn').click()};
$('#lbtn').onclick=async()=>{PW=$('#pw').value;WHO=$('#who').value.trim();if(!WHO){$('#lerr').textContent='Scrivi la firma';return}
  $('#lerr').textContent='...';let r;try{r=await admin('state')}catch(e){$('#lerr').textContent='Nessuna connessione';return}
  if(!r||!r.ok){$('#lerr').textContent='Password sbagliata';return}
  try{localStorage.setItem('mbm_who',WHO)}catch(e){}
  loadState(r);cur=norm(pub);buildTabs();$('#login').classList.add('hide');$('#app').classList.remove('hide');ubtn();
  let dr=null;try{dr=JSON.parse(localStorage.getItem('mbm_draft2')||'null')}catch(e){}
  if(dr&&dr.cur){const mine=norm(dr.cur),from=norm(dr.base||{});const dummy=cur;cur=mine;const nd=diffs(from).length;cur=dummy;
    if(nd||(dr.free||[]).length){if(dr.pid===loadedPid){cur=mine;FREE=dr.free||[];$('#pname').value=dr.name||'';toast('Bozza ripristinata')}
      else{const d=el('<div><h2 class="tt">Bozza trovata</h2><p></p><div class="mrow"><button class="rd no">Scarta</button><button class="go yes">Unisci alla patch online</button></div></div>');d.querySelector('p').textContent='Hai una bozza con '+nd+' modifiche fatta sulla patch #'+dr.pid+'. Ora online c\'è la #'+loadedPid+'.';d.querySelector('.no').onclick=()=>{clearDraft();closeM()};d.querySelector('.yes').onclick=()=>{cur=mergeOnto(pub,from,mine);FREE=dr.free||[];$('#pname').value=dr.name||'';closeM();changed(true)};modal(d)}}}
  render();count()};
