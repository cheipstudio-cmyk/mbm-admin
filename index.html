<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Block Moba · Bilanciamento</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f17;--p1:#151a26;--p2:#1c2333;--ln:#2a3247;--tx:#eef1f8;--dim:#8d97b3;--gold:#ffc94a;--up:#5cf07a;--dn:#ff6b62;--cy:#4fd3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0c0f17 70%,#0c0f17ee);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{width:46px;height:46px;object-fit:contain}
h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:24px;margin:0;color:var(--gold);letter-spacing:1px}
.sp{flex:1}
.pill{background:var(--p2);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--dim)}
.pill b{color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln)}
nav button{flex:none}
button{font:inherit;font-weight:800;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:12px;padding:8px 14px;cursor:pointer}
button.on{background:var(--gold);color:#1a1205;border-color:#ffe08a}
button.go{background:linear-gradient(180deg,#ffd257,#f59a22);color:#2a1600;border:none;font-size:18px;padding:12px 22px;box-shadow:0 4px 0 #b4600c}
button.cy{background:#173447;border-color:#2e6c8c;color:#bfefff}
button:disabled{opacity:.45}
main{padding:14px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:12px}
.ch{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ch img{width:48px;height:48px;border-radius:12px;background:#0005}
.ch .t{font-weight:800;font-size:18px;line-height:1.1}
.ch .s{color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:1fr 92px 64px;gap:6px;align-items:center;padding:3px 0;border-top:1px dashed #ffffff0d}
.row label{font-size:14px;color:var(--dim)}
.row input{width:100%;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:5px 7px;font:inherit;font-weight:700;text-align:right}
.row .df{font-size:12px;text-align:right;color:var(--dim)}
.row.ch2 input{border-color:var(--gold);color:var(--gold)}
.row.ch2 .df.up{color:var(--up)} .row.ch2 .df.dn{color:var(--dn)}
.pair{display:flex;gap:4px;grid-column:span 2}.pair input{min-width:0}
.desc{font-size:12px;color:var(--dim);margin:2px 0 6px}
.filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter input{background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 10px;font:inherit;min-width:200px}
#bar{position:sticky;bottom:0;background:#0c0f17f2;border-top:1px solid var(--ln);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar input{background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px;font:inherit;flex:1;min-width:180px}
.note{display:flex;gap:10px;align-items:center;background:var(--p2);border-radius:12px;padding:6px 10px;margin:5px 0}
.note img{width:36px;height:36px;border-radius:8px}
.note .a{margin-left:auto;font-weight:800}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal .box{background:var(--p1);border:2px solid var(--gold);border-radius:20px;padding:18px;width:min(640px,100%);max-height:88vh;overflow:auto}
#login{max-width:420px;margin:12vh auto;text-align:center}
#login input{width:100%;margin:6px 0;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.err{color:var(--dn);font-weight:700;min-height:22px}
.ok{color:var(--up);font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:4px;text-align:left;font-size:14px}
td input{width:100%;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:5px;font:inherit}
.hist .card{margin-bottom:10px}
small{color:var(--dim)}
</style>
</head>
<body>
<div id="login" class="card">
  <img id="lg" style="width:140px">
  <h1>Bilanciamento</h1>
  <p class="desc">Solo per Eugenio e Andry. Le modifiche vanno a tutti i giocatori come patch.</p>
  <input id="who" placeholder="Firma (es. Andry)">
  <input id="pw" type="password" placeholder="Password admin">
  <div class="err" id="lerr"></div>
  <button class="go" id="lbtn">ENTRA</button>
</div>
<div id="app" style="display:none">
<header>
  <img id="hl"><h1>Bilanciamento</h1><span class="sp"></span>
  <span class="pill">Patch attuale <b id="pid">-</b></span>
  <span class="pill">Giocatori <b id="np">-</b> · online <b id="no">-</b></span>
  <span class="pill">Firma <b id="sig">-</b></span>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="bar">
  <span class="pill">Modifiche <b id="nch">0</b></span>
  <input id="pname" placeholder="Nome patch (es. Patch 1.2: Gigi più forte)">
  <textarea id="pnote" rows="1" placeholder="Note per i giocatori (facoltative, compaiono nel popup della patch)" style="background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px;font:inherit;flex:2;min-width:220px;resize:vertical"></textarea>
  <button class="cy" id="prev">ANTEPRIMA NOTE</button>
  <button class="go" id="pub">PUBBLICA PATCH</button>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

    const mk=(opts,val)=>{const se=el('<select style="background:#0b0e15;color:#eee;border:1px solid #2a3247;border-radius:8px;padding:5px;margin:2px"></select>');for(const [k,l] of opts)se.appendChild(new Option(l,k));se.value=val||'';return se};
    const sopts=[['','nessuno'],...Object.keys(STATES).map(k=>[k,STATES[k][0]])];
    const sIf=mk(sopts,sy.if),bon=el('<input type="number" step="1" style="width:70px;background:#0b0e15;color:#eee;border:1px solid #2a3247;border-radius:8px;padding:5px">'),sAp=mk(sopts.filter(x=>x[0]!=='cc'),sy.apply);
    bon.value=Math.round((+(sy.bonus||0))*100);
    const row=el('<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px"></div>');row.append('Se è ',sIf,' +',bon,'% danni · applica ',sAp);cw.appendChild(row);
    const upd=()=>{const n=JSON.parse(JSON.stringify(syOf(s,false)));if(sIf.value){n.if=sIf.value;n.bonus=(parseFloat(bon.value)||0)/100}else{delete n.if;delete n.bonus}if(sAp.value)n.apply=sAp.value;else delete n.apply;setSy(s,n);box.redraw()};
    sIf.onchange=upd;bon.oninput=upd;sAp.onchange=upd;c.appendChild(cw)}};
  dec();new MutationObserver(dec).observe(g,{childList:true})}
// ---- rune e passive
function vRunes(v){v.appendChild(el('<p class="desc">Bonus fissi delle rune e delle passive degli eroi. La descrizione si rigenera da sola in italiano, inglese e arabo. Le rune con effetti speciali (senza numeri qui) restano come sono.</p>'));const g=el('<div class="grid"></div>');v.appendChild(g);
  const one=(sec,id)=>{const B=_pk(sec)[id];const c=card(sec==='runes'?'rune:'+id:'hero:'+B.hero,B.name,sec==='runes'?'Runa':'Passiva di '+(BASE.heroes[B.hero]?BASE.heroes[B.hero].name:B.hero));
    const eff=()=>{const st=JSON.parse(JSON.stringify(B.st||{}));for(const k of new Set([...Object.keys(B.st||{}).map(x=>'st.'+x),...Object.keys((cur[sec]||{})[id]||{})])){if(!k.startsWith('st.'))continue;const vv=get(sec,id,k);if(vv===null||vv===undefined)delete st[k.slice(3)];else st[k.slice(3)]=vv}return st};
    const box=descBox(li=>Object.keys(B.st||{}).length||Object.keys((cur[sec]||{})[id]||{}).length?genStats(eff(),li):'');c.appendChild(box);
    const wrong=k=>sec==='passives'&&((DMGT[B.hero]==='phys'&&k==='ap')||(DMGT[B.hero]==='magic'&&k==='ad'));
    if(sec==='runes'&&(B.c||B.g)){const pk=B.c?'c':'g';frow(c,B.c?'Prezzo (monete)':'Prezzo (diamanti)',sec,id,pk,undefined,{icon:B.c?'coin':'gem'})}
    for(const k of new Set([...Object.keys(B.st||{}).map(x=>'st.'+x),...Object.keys((cur[sec]||{})[id]||{})])){if(!k.startsWith('st.')||get(sec,id,k)===null)continue;frow(c,(STLAB[k.slice(3)]||k)+(wrong(k.slice(3))?' ⚠ inutile: '+(BASE.heroes[B.hero]?BASE.heroes[B.hero].name:B.hero)+(DMGT[B.hero]==='phys'?' fa danni fisici':' fa danni magici'):''),sec,id,k);const rw=c.lastElementChild;const x=el('<button title="Togli questo bonus" style="margin-right:8px;vertical-align:middle;background:none;border:1px solid #4a5577;color:#ff6b6b;border-radius:8px;width:26px;height:26px;padding:0;font-weight:800;cursor:pointer">✕</button>');x.onclick=()=>{set(sec,id,k,null);c.replaceWith(one(sec,id))};const lb=rw.querySelector('label');lb.prepend(x)}
    const add=el('<select style="margin-top:8px;width:100%;background:#0b0e15;color:#ffd166;border:1px dashed #4a5577;border-radius:10px;padding:9px;font-weight:700"></select>');add.appendChild(new Option('+ Aggiungi bonus',''));for(const k of STO){if(wrong(k))continue;const cv=get(sec,id,'st.'+k);if(cv===undefined||cv===null)add.appendChild(new Option(STLAB[k],k))}
    add.onchange=()=>{if(!add.value)return;set(sec,id,'st.'+add.value,STDEF[add.value]);c.replaceWith(one(sec,id))};c.appendChild(add);
    c.addEventListener('input',()=>setTimeout(box.redraw,0));return c};
  for(const id in RUNEB)g.appendChild(one('runes',id));for(const id in PASB)if(Object.keys(PASB[id].st||{}).length)g.appendChild(one('passives',id))}
// ---- incantesimi: tutti i numeri + descrizione
function genSpell(sp,li){const v=k=>get('spells',sp+'.'+k);const N=x=>_n(+x,li);
  switch(sp){case 'flash':return _t('Ti teletrasporti di '+N(get('spells','flash.dist'))+' m nella direzione scelta, anche oltre i muretti.','Teleports you '+N(get('spells','flash.dist'))+' m in the chosen direction, even over walls.','ينقلك '+N(get('spells','flash.dist'))+' م في الاتجاه المختار، حتى فوق الجدران.',li);
  case 'ignite':return _t("Brucia l'eroe nemico più vicino (entro "+N(v('r'))+' m) per '+N(v('t'))+' s: '+N(v('dmg'))+' danni al secondo (+'+N(v('dmg_l'))+' per livello).','Burns the nearest enemy hero (within '+N(v('r'))+' m) for '+N(v('t'))+' s: '+N(v('dmg'))+' damage per second (+'+N(v('dmg_l'))+' per level).','يحرق أقرب بطل عدو (ضمن '+N(v('r'))+' م) لمدة '+N(v('t'))+' ث: '+N(v('dmg'))+' ضرر في الثانية (+'+N(v('dmg_l'))+' لكل مستوى).',li);
  case 'heal':return _t('Cura te di '+N(v('base'))+' (+'+N(v('l'))+' per livello) e gli alleati entro '+N(v('r'))+' m di '+N(v('ally'))+' (+'+N(v('ally_l'))+' per livello), con +'+_pct(v('spd'),li)+' velocità per '+N(v('spd_t'))+' s.','Heals you for '+N(v('base'))+' (+'+N(v('l'))+' per level) and allies within '+N(v('r'))+' m for '+N(v('ally'))+' (+'+N(v('ally_l'))+' per level), with +'+_pct(v('spd'),li)+' speed for '+N(v('spd_t'))+' s.','يشفيك بمقدار '+N(v('base'))+' (+'+N(v('l'))+' لكل مستوى) والحلفاء ضمن '+N(v('r'))+' م بمقدار '+N(v('ally'))+' (+'+N(v('ally_l'))+' لكل مستوى)، مع +'+_pct(v('spd'),li)+' سرعة لمدة '+N(v('spd_t'))+' ث.',li);
  case 'ghost':return _t('+'+_pct(v('spd'),li)+' di velocità per '+N(v('t'))+' s.','+'+_pct(v('spd'),li)+' move speed for '+N(v('t'))+' s.','+'+_pct(v('spd'),li)+' سرعة لمدة '+N(v('t'))+' ث.',li);
  case 'barrier':return _t('Uno scudo di '+N(v('base'))+' (+'+N(v('l'))+' per livello) per '+N(v('t'))+' s.','A '+N(v('base'))+' shield (+'+N(v('l'))+' per level) for '+N(v('t'))+' s.','درع بقيمة '+N(v('base'))+' (+'+N(v('l'))+' لكل مستوى) لمدة '+N(v('t'))+' ث.',li);
  case 'smite':return _t(N(v('base'))+' danni (+'+N(v('l'))+' per livello) a un mostro, a Pablo o a un minion entro '+N(v('r'))+' m.',N(v('base'))+' damage (+'+N(v('l'))+' per level) to a monster, Pablo or a minion within '+N(v('r'))+' m.',N(v('base'))+' ضرر (+'+N(v('l'))+' لكل مستوى) على وحش أو بابلو أو تابع ضمن '+N(v('r'))+' م.',li)}return ''}
function vSpells(v){const g=el('<div class="grid"></div>');for(const sp in BASE.spells){const c=card('spell:'+sp,BASE.spells[sp].name,'Incantesimo');const box=descBox(li=>genSpell(sp,li));c.appendChild(box);frow(c,'Ricarica (s)','spells',sp+'.cd');for(const k in SPN)if(k.split('.')[0]===sp)frow(c,SPN[k][0],'spells',k);c.addEventListener('input',()=>setTimeout(box.redraw,0));g.appendChild(c)}v.appendChild(g)}
</script>
