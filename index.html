<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Block Moba · Bilanciamento</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f17;--p1:#151a26;--p2:#1c2333;--ln:#2a3247;--tx:#eef1f8;--dim:#8d97b3;--gold:#ffc94a;--up:#5cf07a;--dn:#ff6b62;--cy:#4fd3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Baloo 2',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0c0f17 70%,#0c0f17ee);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{width:46px;height:46px;object-fit:contain}
h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:24px;margin:0;color:var(--gold);letter-spacing:1px}
.sp{flex:1}
.pill{background:var(--p2);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--dim)}
.pill b{color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--ln)}
nav button{flex:none}
button{font:inherit;font-weight:800;border:1px solid var(--ln);background:var(--p2);color:var(--tx);border-radius:12px;padding:8px 14px;cursor:pointer}
button.on{background:var(--gold);color:#1a1205;border-color:#ffe08a}
button.go{background:linear-gradient(180deg,#ffd257,#f59a22);color:#2a1600;border:none;font-size:18px;padding:12px 22px;box-shadow:0 4px 0 #b4600c}
button.cy{background:#173447;border-color:#2e6c8c;color:#bfefff}
button:disabled{opacity:.45}
main{padding:14px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:12px}
.ch{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ch img{width:48px;height:48px;border-radius:12px;background:#0005}
.ch .t{font-weight:800;font-size:18px;line-height:1.1}
.ch .s{color:var(--dim);font-size:13px}
.row{display:grid;grid-template-columns:1fr 92px 64px;gap:6px;align-items:center;padding:3px 0;border-top:1px dashed #ffffff0d}
.row label{font-size:14px;color:var(--dim)}
.row input{width:100%;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:5px 7px;font:inherit;font-weight:700;text-align:right}
.row .df{font-size:12px;text-align:right;color:var(--dim)}
.row.ch2 input{border-color:var(--gold);color:var(--gold)}
.row.ch2 .df.up{color:var(--up)} .row.ch2 .df.dn{color:var(--dn)}
.pair{display:flex;gap:4px;grid-column:span 2}.pair input{min-width:0}
.desc{font-size:12px;color:var(--dim);margin:2px 0 6px}
.filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter input{background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:8px 10px;font:inherit;min-width:200px}
#bar{position:sticky;bottom:0;background:#0c0f17f2;border-top:1px solid var(--ln);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#bar input{background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:10px;font:inherit;flex:1;min-width:180px}
.note{display:flex;gap:10px;align-items:center;background:var(--p2);border-radius:12px;padding:6px 10px;margin:5px 0}
.note img{width:36px;height:36px;border-radius:8px}
.note .a{margin-left:auto;font-weight:800}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal .box{background:var(--p1);border:2px solid var(--gold);border-radius:20px;padding:18px;width:min(640px,100%);max-height:88vh;overflow:auto}
#login{max-width:420px;margin:12vh auto;text-align:center}
#login input{width:100%;margin:6px 0;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px;font:inherit}
.err{color:var(--dn);font-weight:700;min-height:22px}
.ok{color:var(--up);font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:4px;text-align:left;font-size:14px}
td input{width:100%;background:#0b0e15;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:5px;font:inherit}
.hist .card{margin-bottom:10px}
small{color:var(--dim)}
</style>
</head>
<body>
<div id="login" class="card">
  <img id="lg" style="width:140px">
  <h1>Bilanciamento</h1>
  <p class="desc">Solo per Eugenio e Andry. Le modifiche vanno a tutti i giocatori come patch.</p>
  <input id="who" placeholder="Firma (es. Andry)">
  <input id="pw" type="password" placeholder="Password admin">
  <div class="err" id="lerr"></div>
  <button class="go" id="lbtn">ENTRA</button>
</div>
<div id="app" style="display:none">
<header>
  <img id="hl"><h1>Bilanciamento</h1><span class="sp"></span>
  <span class="pill">Patch attuale <b id="pid">-</b></span>
  <span class="pill">Giocatori <b id="np">-</b> · online <b id="no">-</b></span>
  <span class="pill">Firma <b id="sig">-</b></span>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="bar">
  <span class="pill">Modifiche <b id="nch">0</b></span>
  <input id="pname" placeholder="Nome patch (es. Patch 1.2: Gigi più forte)">
  <button class="cy" id="prev">ANTEPRIMA NOTE</button>
  <button class="go" id="pub">PUBBLICA PATCH</button>
</div>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>

  $('#pid').textContent=state.patch?('#'+state.patch.id+' '+(state.patch.name||'')):'nessuna';$('#np').textContent=state.players;$('#no').textContent=state.online;$('#sig').textContent=WHO;count()}
// valore in vigore ora (patch pubblicata) e valore del codice
function live(sec,id,k){const p=state.patch&&state.patch.data||{};if(sec==='heroes'||sec==='skills'){const o=(p[sec]||{})[id];return o&&o[k]!==undefined?o[k]:undefined}const o=p[sec]||{};return o[id]}
function def(sec,id,k){if(sec==='heroes')return BASE.heroes[id].stats[k];if(sec==='skills')return BASE.skills[id].f[k];if(sec==='units')return UNITS[id][2];if(sec==='eco')return ECO[id][1];if(sec==='spells'){if(id==='flash.dist')return 8.5;return BASE.spells[id.split('.')[0]].cd}}
function get(sec,id,k){if(sec==='heroes'||sec==='skills'){const o=cur[sec][id];if(o&&o[k]!==undefined)return o[k];return def(sec,id,k)}return cur[sec][id]!==undefined?cur[sec][id]:def(sec,id)}
function set(sec,id,k,v){if(sec==='heroes'||sec==='skills'){cur[sec][id]=cur[sec][id]||{};if(JSON.stringify(v)===JSON.stringify(def(sec,id,k)))delete cur[sec][id][k];else cur[sec][id][k]=v;if(!Object.keys(cur[sec][id]).length)delete cur[sec][id]}else{if(JSON.stringify(v)===JSON.stringify(def(sec,id)))delete cur[sec][id];else cur[sec][id]=v}count()}
function before(sec,id,k){const l=(sec==='heroes'||sec==='skills')?live(sec,id,k):live(sec,id);return l!==undefined?l:((sec==='heroes'||sec==='skills')?def(sec,id,k):def(sec,id))}
function fmt(v){return Array.isArray(v)?v[0]+' + '+Math.round(v[1]*100)+'%':(Math.round(v*1000)/1000)+''}
function diffs(){const out=[];
  for(const h in BASE.heroes)for(const k in BASE.heroes[h].stats){const a=before('heroes',h,k),b=get('heroes',h,k);if(JSON.stringify(a)!==JSON.stringify(b))out.push({icon:'hero:'+h,title:BASE.heroes[h].name,lab:HLAB[k]||k,a,b,inv:INV.has(k)})}
  for(const s in BASE.skills)for(const k in BASE.skills[s].f){const a=before('skills',s,k),b=get('skills',s,k);if(JSON.stringify(a)!==JSON.stringify(b))out.push({icon:'skill:'+s,title:BASE.skills[s].name+' ('+BASE.heroes[BASE.skills[s].hero].name+')',lab:SLAB[k]||k,a,b,inv:INV.has(k)})}
  for(const u in UNITS){const a=before('units',u),b=get('units',u);if(a!==b)out.push({icon:'unit:'+UNITS[u][3],title:UNITS[u][0],lab:UNITS[u][1],a,b,inv:false})}
  for(const sp in BASE.spells){const id=sp+'.cd',a=before('spells',id),b=get('spells',id);if(a!==b)out.push({icon:'spell:'+sp,title:BASE.spells[sp].name,lab:'Ricarica (s)',a,b,inv:true})}
  {const a=before('spells','flash.dist'),b=get('spells','flash.dist');if(a!==b)out.push({icon:'spell:flash',title:'Flash',lab:'Distanza (m)',a,b,inv:false})}
  for(const e in ECO){const a=before('eco',e),b=get('eco',e);if(a!==b)out.push({icon:'unit:minion',title:'Economia',lab:ECO[e][0],a,b,inv:false})}
  return out}
function num(v){return Array.isArray(v)?v[0]:v}
function notes(){return diffs().map(d=>{const up=(num(d.b)>num(d.a))!==d.inv;return{icon:d.icon,title:d.title,text:d.lab+': '+fmt(d.a)+' → '+fmt(d.b),dir:num(d.b)===num(d.a)?'':(up?'up':'down')}})}
function count(){$('#nch').textContent=diffs().length}
const TABS=[['heroes','Eroi'],['skills','Abilità'],['units','Minion e mostri'],['spells','Incantesimi'],['eco','Economia'],['seasons','Stagioni'],['version','Versione app'],['hist','Storico patch']];
function render(){const n=$('#tabs');n.innerHTML='';for(const[t,l]of TABS){const b=document.createElement('button');b.textContent=l;b.className=t===tab?'on':'';b.onclick=()=>{tab=t;render()};n.appendChild(b)}
  $('#bar').style.display=['seasons','version','hist'].includes(tab)?'none':'flex';const v=$('#view');v.innerHTML='';({heroes:vHeroes,skills:vSkills,units:vUnits,spells:vSpells,eco:vEco,seasons:vSeasons,version:vVersion,hist:vHist})[tab](v)}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function card(icon,t,s){const c=el(`<div class="card"><div class="ch"><img src="${ICONS[icon]||''}"><div><div class="t"></div><div class="s"></div></div></div></div>`);c.querySelector('.t').textContent=t;c.querySelector('.s').textContent=s||'';return c}
function frow(c,lab,sec,id,k){const r=el(`<div class="row"><label></label><span></span><span class="df"></span></div>`);r.querySelector('label').textContent=lab;const box=r.children[1];const df=r.querySelector('.df');
  const d=(sec==='heroes'||sec==='skills')?def(sec,id,k):def(sec,id);const v=(sec==='heroes'||sec==='skills')?get(sec,id,k):get(sec,id);const kk=k||id;
  const upd=()=>{const nv=(sec==='heroes'||sec==='skills')?get(sec,id,k):get(sec,id);const b=before(sec,id,k);const changed=JSON.stringify(nv)!==JSON.stringify(b);r.classList.toggle('ch2',changed);
    if(changed){const up=(num(nv)>num(b))!==INV.has(kk);df.className='df '+(up?'up':'dn');df.textContent='era '+fmt(b)}else{df.className='df';df.textContent=JSON.stringify(nv)!==JSON.stringify(d)?'base '+fmt(d):''}};
  if(Array.isArray(d)){box.className='pair';df.style.display='none';const a=el('<input type="number" step="any">'),b=el('<input type="number" step="any">');a.value=v[0];b.value=v[1];const f=()=>{set(sec,id,k,[parseFloat(a.value)||0,parseFloat(b.value)||0]);upd()};a.oninput=f;b.oninput=f;box.append(a,b)}
  else{const i=el('<input type="number" step="any">');i.value=v;i.oninput=()=>{const x=parseFloat(i.value);if(!isNaN(x)){set(sec,id,k,x);upd()}};box.appendChild(i)}
  upd();c.appendChild(r)}
function vHeroes(v){const g=el('<div class="grid"></div>');for(const h in BASE.heroes){const H=BASE.heroes[h];const c=card('hero:'+h,H.name,H.title);for(const k in H.stats)frow(c,HLAB[k]||k,'heroes',h,k);g.appendChild(c)}v.appendChild(g)}
function vSkills(v){const f=el('<div class="filter"><input placeholder="Cerca abilità o eroe"></div>');const sel=el('<select style="background:#0b0e15;color:#eee;border:1px solid #2a3247;border-radius:10px;padding:8px"></select>');sel.appendChild(new Option('Tutti gli eroi',''));for(const h in BASE.heroes)sel.appendChild(new Option(BASE.heroes[h].name,h));f.appendChild(sel);v.appendChild(f);const inp=f.querySelector('input');inp.value=flt;
  const g=el('<div class="grid"></div>');v.appendChild(g);const draw=()=>{g.innerHTML='';const q=inp.value.toLowerCase();flt=inp.value;for(const s in BASE.skills){const S=BASE.skills[s];if(sel.value&&S.hero!==sel.value)continue;if(q&&!(S.name+' '+BASE.heroes[S.hero].name).toLowerCase().includes(q))continue;const c=card('skill:'+s,S.name+(S.ult?' · ULTI':''),BASE.heroes[S.hero].name);const d=el('<div class="desc"></div>');d.textContent=S.desc;c.appendChild(d);for(const k in S.f)frow(c,SLAB[k]||k.replace('p.',''),'skills',s,k);g.appendChild(c)}};inp.oninput=draw;sel.onchange=draw;draw()}
function vUnits(v){const g=el('<div class="grid"></div>');const groups={};for(const u in UNITS){(groups[UNITS[u][0]]=groups[UNITS[u][0]]||[]).push(u)}for(const name in groups){const c=card('unit:'+UNITS[groups[name][0]][3],name,'');for(const u of groups[name])frow(c,UNITS[u][1],'units',u);g.appendChild(c)}v.appendChild(g)}
function vSpells(v){const g=el('<div class="grid"></div>');for(const sp in BASE.spells){const c=card('spell:'+sp,BASE.spells[sp].name,'Incantesimo');frow(c,'Ricarica (s)','spells',sp+'.cd');if(sp==='flash')frow(c,'Distanza (m)','spells','flash.dist');g.appendChild(c)}v.appendChild(g)}
function vEco(v){const c=card('unit:minion','Economia','Oro e ricompense');for(const e in ECO)frow(c,ECO[e][0],'eco',e);v.appendChild(c)}
function dt(s){const d=new Date(s*1000);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function vSeasons(v){v.appendChild(el('<p class="desc">Fra la fine di una stagione e l\'inizio della successiva le ranked restano chiuse. A fine stagione i giocatori ricevono il premio della fascia raggiunta e le coppe sopra la soglia scendono a metà della differenza.</p>'));
  const list=(state.seasons||[]).slice();const nid=list.length?Math.max(...list.map(s=>s.id))+1:1;const last=list[list.length-1];
  list.push({id:nid,name:'Stagione '+nid,start:last?last.end+(last.break_h||36)*3600:Date.now()/1000,end:(last?last.end+(last.break_h||36)*3600:Date.now()/1000)+60*86400,break_h:36,floor:1000,rewards:last?last.rewards:[],heroes:[],_new:true});
  for(const s of list){const c=card('logo',(s._new?'NUOVA: ':'')+'#'+s.id,'');c.querySelector('.ch img').style.width='70px';
    const f=el(`<div><div class="row"><label>Nome</label><input class="nm" style="grid-column:span 2;text-align:left"></div>
    <div class="row"><label>Inizio</label><input type="datetime-local" class="st" style="grid-column:span 2"></div>
    <div class="row"><label>Fine</label><input type="datetime-local" class="en" style="grid-column:span 2"></div>
    <div class="row"><label>Pausa dopo (ore)</label><input type="number" class="br"><span></span></div>
    <div class="row"><label>Soglia reset coppe</label><input type="number" class="fl"><span></span></div>
    <p class="desc">Premi di fine stagione (coppe migliori raggiunte):</p><table><tr><th>Coppe</th><th>Monete</th><th>Gemme</th><th></th></tr></table>
    <button class="cy add" style="margin:6px 0">+ fascia</button> <button class="go sv">SALVA STAGIONE</button> <span class="msg"></span></div>`);
    f.querySelector('.nm').value=s.name;f.querySelector('.st').value=dt(s.start);f.querySelector('.en').value=dt(s.end);f.querySelector('.br').value=s.break_h;f.querySelector('.fl').value=s.floor;
    const tb=f.querySelector('table');const rows=[];const addr=(r)=>{const tr=el(`<tr><td><input type="number" class="a"></td><td><input type="number" class="b"></td><td><input type="number" class="c"></td><td><button>✕</button></td></tr>`.replace(/<tr>/,'<tr>'));const t2=document.createElement('tbody');t2.innerHTML=`<tr><td><input type="number" class="a"></td><td><input type="number" class="b"></td><td><input type="number" class="c"></td><td><button>✕</button></td></tr>`;const row=t2.firstChild;row.querySelector('.a').value=r.tr;row.querySelector('.b').value=r.coins;row.querySelector('.c').value=r.gems;row.querySelector('button').onclick=()=>{row.remove();rows.splice(rows.indexOf(row),1)};tb.appendChild(row);rows.push(row)};
    for(const r of s.rewards||[])addr(r);f.querySelector('.add').onclick=()=>addr({tr:0,coins:0,gems:0});
    f.querySelector('.sv').onclick=async()=>{const m=f.querySelector('.msg');m.textContent='...';const args={id:s.id,name:f.querySelector('.nm').value,start:new Date(f.querySelector('.st').value).getTime()/1000,end:new Date(f.querySelector('.en').value).getTime()/1000,break_h:parseInt(f.querySelector('.br').value)||36,floor:parseInt(f.querySelector('.fl').value)||1000,rewards:rows.map(r=>({tr:parseInt(r.querySelector('.a').value)||0,coins:parseInt(r.querySelector('.b').value)||0,gems:parseInt(r.querySelector('.c').value)||0})).sort((x,y)=>x.tr-y.tr),heroes:s.heroes||[]};
      const r=await admin('season',args);if(r.ok){m.className='ok';m.textContent='Salvata';const st=await admin('state');state=st;setTimeout(render,600)}else{m.className='err';m.textContent='Errore'}};
    c.appendChild(f);v.appendChild(c)}}
function vVersion(v){const ver=state.version||{};const c=card('logo','Versione dell\'app','Chi ha una versione più vecchia del minimo non può entrare online finché non aggiorna');c.querySelector('.ch img').style.width='70px';
  const f=el(`<div><div class="row"><label>Versione minima (version code)</label><input type="number" class="mi"><span></span></div>
  <div class="row"><label>Ultima versione pubblicata</label><input type="number" class="la"><span></span></div>
  <div class="row"><label>Link Play Store</label><input class="an" style="grid-column:span 2;text-align:left"></div>
  <div class="row"><label>Link App Store</label><input class="io" style="grid-column:span 2;text-align:left"></div>
  <button class="go sv" style="margin-top:10px">SALVA</button> <span class="msg"></span></div>`);
  f.querySelector('.mi').value=ver.min_code||0;f.querySelector('.la').value=ver.latest_code||0;f.querySelector('.an').value=ver.android||'';f.querySelector('.io').value=ver.ios||'';
  f.querySelector('.sv').onclick=()=>confirmBox('Aggiornare la versione minima a '+f.querySelector('.mi').value+'? Chi ha una versione più vecchia vedrà il blocco "aggiorna".',async()=>{const r=await admin('version',{min_code:parseInt(f.querySelector('.mi').value)||0,latest_code:parseInt(f.querySelector('.la').value)||0,android:f.querySelector('.an').value,ios:f.querySelector('.io').value});const m=f.querySelector('.msg');m.className=r.ok?'ok':'err';m.textContent=r.ok?'Salvato':'Errore';if(r.ok){state=await admin('state')}});
  c.appendChild(f);v.appendChild(c)}
function vHist(v){const w=el('<div class="hist"></div>');for(const p of state.patches||[]){const c=card('logo','#'+p.id+' '+(p.name||''),new Date(p.at*1000).toLocaleString('it-IT')+' · by '+(p.author||'?'));c.querySelector('.ch img').style.width='70px';for(const n of p.notes||[])c.appendChild(noteEl(n));w.appendChild(c)}if(!(state.patches||[]).length)w.appendChild(el('<p class="desc">Nessuna patch pubblicata.</p>'));v.appendChild(w)}
function noteEl(n){const e=el(`<div class="note"><img><div><b></b><div><small></small></div></div><span class="a"></span></div>`);e.querySelector('img').src=ICONS[n.icon]||ICONS['unit:minion'];e.querySelector('b').textContent=n.title;e.querySelector('small').textContent=n.text;const a=e.querySelector('.a');a.textContent=n.dir==='up'?'▲':(n.dir==='down'?'▼':'•');a.style.color=n.dir==='up'?'var(--up)':(n.dir==='down'?'var(--dn)':'var(--dim)');return e}
function modal(html){$('#mbox').innerHTML='';$('#mbox').appendChild(html);$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none'}
function confirmBox(text,yes){const d=el('<div><h1 style="font-size:22px">Conferma</h1><p></p><button class="cy no">Annulla</button> <button class="go yes">Conferma</button></div>');d.querySelector('p').textContent=text;d.querySelector('.no').onclick=closeM;d.querySelector('.yes').onclick=()=>{closeM();yes()};modal(d)}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
$('#prev').onclick=()=>{const ns=notes();const d=el('<div><h1 style="font-size:22px">Note della patch</h1><p class="desc">Così le vedono i giocatori nel popup di aggiornamento.</p></div>');for(const n of ns)d.appendChild(noteEl(n));if(!ns.length)d.appendChild(el('<p>Nessuna modifica rispetto alla patch attuale.</p>'));const s=el('<p style="text-align:right;font-family:Luckiest Guy;color:var(--gold);font-size:22px"></p>');s.textContent='by '+WHO;d.appendChild(s);const b=el('<button class="cy">Chiudi</button>');b.onclick=closeM;d.appendChild(b);modal(d)};
$('#pub').onclick=()=>{const ns=notes();if(!ns.length){$('#prev').click();return}const name=$('#pname').value.trim()||('Patch '+((state.patch?state.patch.id:0)+1));
  confirmBox('Pubblicare "'+name+'" con '+ns.length+' modifiche? I giocatori connessi la scaricano subito (non durante le partite).',async()=>{const r=await admin('publish',{name,author:WHO,data:cur,notes:ns});if(r.ok){state=await admin('state');load();render();const d=el('<div><h1 style="font-size:22px;color:var(--up)">Patch pubblicata!</h1><p></p><button class="go">OK</button></div>');d.querySelector('p').textContent=name+' è online.';d.querySelector('button').onclick=closeM;modal(d)}else{const d=el('<div><h1 style="font-size:22px;color:var(--dn)">Errore</h1><button class="cy">OK</button></div>');d.querySelector('button').onclick=closeM;modal(d)}})};
</script>
</body>
